{% extends 'core/base.html' %}

{% block title %}Bookly | Contraseña actualizada{% endblock %}

{% block content %}
<main class="auth-page auth-page--login">
    <div class="auth-container">
        <section class="auth-card">
            <h2 class="auth-heading">Contraseña actualizada</h2>
            <p class="msg-success">Tu contraseña fue cambiada correctamente.</p>
            <p class="auth-switch"><a href="{% url 'login' %}">Iniciar sesión</a></p>
        </section>
    </div>
</main>
{% endblock %}
