{% extends 'core/base.html' %}

{% block title %}Bookly | Contacto{% endblock %}

{% block content %}
    <!-- FORMULARIO CONTACTO -->
    <section class="contacto">
        <h2>Déjenos su mensaje</h2>
        <div class="contact-container">
            <form>
                <div class="form-group">
                    <input type="text" placeholder="Nombre">
                    <input type="email" placeholder="Email">
                </div>
                <div class="form-group">
                    <input type="text" placeholder="Fono">
                    <input type="text" placeholder="Empresa">
                </div>
                <select>
                    <option>Seleccione Motivo</option>
                    <option>Consulta</option>
                    <option>Reclamo</option>
                    <option>Otro</option>
                </select>
                <textarea placeholder="Mensaje"></textarea>
                <button type="submit" class="btn-enviar"><i class="bi bi-envelope"></i> ENVIAR</button>
            </form>
            <div class="info">
                <div class="phone-block">
                    <i class="bi bi-telephone-outbound-fill"></i>
                    <h3>(+56) 2 1234 5678</h3>
                </div>
                <p class="address">Casa Matriz: Av. Concha y Toro 2730, Puente Alto.</p>
                <p class="email">Email tienda.virtual@Bookly.cl</p>
            </div>
        </div>
    </section>
{% endblock %}
