{% extends 'core/base.html' %}

{% block title %}Bookly | Revisa tu correo{% endblock %}

{% block content %}
<main class="auth-page auth-page--login">
    <div class="auth-container">
        <section class="auth-card">
            <h2 class="auth-heading">Revisa tu correo</h2>
            <p class="msg-success">Si existe una cuenta con ese correo, recibirás un enlace para restablecer tu contraseña.</p>
            <p class="auth-switch"><a href="{% url 'login' %}">Volver a iniciar sesión</a></p>
        </section>
    </div>
</main>
{% endblock %}
